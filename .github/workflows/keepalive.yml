name: Supabase Keepalive

on:
  schedule:
    - cron: '0 15 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://oaurovkvyrywmdsjhgaj.supabase.co/rest/v1/${{ secrets.SUPABASE_PING_TABLE }}?select=id&limit=1" \
            -H
