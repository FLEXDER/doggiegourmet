name: Deploy

# Publica el sitio en GitHub Pages en cada commit a main.
# También se puede lanzar a mano: Actions > Deploy > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan varios commits seguidos, se publica uno a la vez y gana el último.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (src/)
        run: npm run lint

      # Construye el sitio con Vite en dist/ (código de src/ + archivos de public/).
      - name: Construir el sitio
        run: npm run build

      - name: Revisar que no falte nada esencial
        run: |
          for f in index.html CNAME 404.html assets/brand/logo.png favicon.svg site.webmanifest; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::Falta dist/$f"
              exit 1
            fi
          done
          if grep -q 'VISTA PREVIA' dist/index.html; then
            echo "::error::dist/index.html trae la franja de vista previa"
            exit 1
          fi
          echo "Dominio: $(cat dist/CNAME)"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
