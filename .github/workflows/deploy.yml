name: Deploy

# Publica el sitio en GitHub Pages en cada commit a main.
# También se puede lanzar a mano: Actions > Deploy > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan varios commits seguidos, se publica uno a la vez y gana el último.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (src/)
        run: npm run lint

      # Transición (Fase 2): las fotos y favicons siguen en la raíz del repo;
      # se copian a public/ solo dentro de esta corrida para el build de Vite.
      - name: Preparar public/ para la vista previa
        run: |
          mkdir public
          cp -r assets favicon.svg favicon.ico favicon-*.png apple-touch-icon.png \
            site.webmanifest web-app-manifest-*.png public/

      - name: Construir la vista previa (Vite)
        run: npm run build
        env:
          DG_PREVIEW: '1'

      - name: Copiar archivos del sitio
        run: |
          mkdir _site
          # El sitio actual se publica tal cual en la raíz, excepto lo que no es
          # parte del sitio (incluido el código y las herramientas de Vite).
          tar -cf - \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./supabase \
            --exclude=./README.md \
            --exclude=./.gitattributes \
            --exclude=./.gitignore \
            --exclude=./_site \
            --exclude=./src \
            --exclude=./public \
            --exclude=./dist \
            --exclude=./node_modules \
            --exclude=./package.json \
            --exclude=./package-lock.json \
            --exclude=./vite.config.js \
            --exclude=./eslint.config.js \
            . | tar -xf - -C _site
          # La versión de Vite va en /preview/.
          cp -r dist _site/preview

      - name: Revisar que no falte nada esencial
        run: |
          for f in index.html CNAME 404.html styles.css data.js app.jsx preview/index.html preview/assets/brand/logo.png; do
            if [ ! -f "_site/$f" ]; then
              echo "::error::Falta _site/$f"
              exit 1
            fi
          done
          echo "Dominio: $(cat _site/CNAME)"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
